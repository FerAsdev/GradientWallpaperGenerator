<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gradient Wallpaper Studio</title>
  <link rel="stylesheet" href="./src/styles/main.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div>
        <p class="eyebrow">Gradient Wallpaper Studio</p>
        <h1>Wallpapers de gradientes de ultra alta calidad.</h1>
      </div>
      <div class="topbar__actions">
        <button id="randomize" class="btn btn--ghost" type="button">Inspirar</button>
        <button id="export" class="btn btn--primary" type="button">Exportar PNG</button>
      </div>
    </header>

    <main class="grid">
      <section class="panel">
        <h2>Composición</h2>
        <div class="field">
          <label for="gradientType">Tipo de gradiente</label>
          <select id="gradientType">
            <option value="linear">Lineal</option>
            <option value="radial">Radial</option>
            <option value="conic">Cónico</option>
            <option value="mesh">Mesh (multi-layer)</option>
          </select>
        </div>

        <div class="field" id="angleField">
          <label for="angle">Ángulo (°)</label>
          <div class="range">
            <input id="angle" type="range" min="0" max="360" value="135" />
            <span id="angleValue">135°</span>
          </div>
        </div>

        <div class="grid-two" id="radialField">
          <div class="field">
            <label for="centerX">Centro X (%)</label>
            <input id="centerX" type="number" min="0" max="100" value="50" />
          </div>
          <div class="field">
            <label for="centerY">Centro Y (%)</label>
            <input id="centerY" type="number" min="0" max="100" value="45" />
          </div>
        </div>

        <div class="grid-two" id="meshField">
          <div class="field">
            <label for="meshLayers">Capas Mesh</label>
            <input id="meshLayers" type="number" min="2" max="6" value="3" />
          </div>
          <div class="field">
            <label for="meshBlur">Blur (px)</label>
            <input id="meshBlur" type="number" min="0" max="240" value="140" />
          </div>
        </div>

        <h2>Paleta y stops</h2>
        <div class="field">
          <label for="palette">Paletas curadas</label>
          <select id="palette"></select>
        </div>

        <div id="stops" class="stops"></div>
        <div class="actions">
          <button id="addStop" class="btn btn--ghost" type="button">Añadir stop</button>
          <button id="sortStops" class="btn btn--ghost" type="button">Ordenar</button>
          <button id="resetStops" class="btn btn--ghost" type="button">Reset</button>
        </div>
      </section>

      <section class="panel panel--preview">
        <div class="preview" id="preview"></div>
        <div class="meta">
          <div>
            <p class="meta__label">Resolución detectada</p>
            <p id="detectedResolution" class="meta__value"></p>
          </div>
          <div>
            <p class="meta__label">CSS generado</p>
            <p id="cssOutput" class="meta__value"></p>
          </div>
        </div>
      </section>

      <section class="panel">
        <h2>Exportación</h2>
        <div class="grid-two">
          <div class="field">
            <label for="width">Ancho (px)</label>
            <input id="width" type="number" min="320" max="12000" />
          </div>
          <div class="field">
            <label for="height">Alto (px)</label>
            <input id="height" type="number" min="320" max="12000" />
          </div>
        </div>

        <div class="actions">
          <button id="useScreen" class="btn btn--ghost" type="button">Pantalla actual</button>
          <button id="use4k" class="btn btn--ghost" type="button">4K</button>
          <button id="use8k" class="btn btn--ghost" type="button">8K</button>
        </div>

        <div class="field">
          <label for="scale">Escala de exportación</label>
          <div class="range">
            <input id="scale" type="range" min="1" max="2" step="0.1" value="1" />
            <span id="scaleValue">1x</span>
          </div>
        </div>

        <div class="field">
          <label for="fileName">Nombre del archivo</label>
          <input id="fileName" type="text" value="gradient-wallpaper" />
        </div>

        <div class="actions">
          <button id="render" class="btn btn--ghost" type="button">Renderizar canvas</button>
          <button id="copyCss" class="btn btn--ghost" type="button">Copiar CSS</button>
        </div>
        <p id="exportInfo" class="helper"></p>
      </section>
    </main>
  </div>

  <canvas id="canvas" class="sr-only"></canvas>

  <script src="./src/scripts/app.js"></script>
</body>
</html>
